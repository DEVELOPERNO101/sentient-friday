[workspace]
members = [
  "crates/shared",
  "crates/models",
  "crates/core",
  "crates/sources",
  "crates/engine",
  "crates/agent",
  "crates/scheduler",
  "crates/platform"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
